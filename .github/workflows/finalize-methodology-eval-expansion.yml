name: Finalize methodology evaluation expansion

on:
  push:
    paths:
      - '.github/workflows/finalize-methodology-eval-expansion.yml'
      - '.github/scripts/finalize_methodology_eval_expansion.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/unified-cca-skill
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply final cleanup
        run: python .github/scripts/finalize_methodology_eval_expansion.py
      - name: Run evaluation harness tests
        run: python -m unittest discover -s evals/tests -v
      - name: Validate repository invariants
        run: python .github/scripts/validate_repo.py
      - name: Smoke methodology fixture preparation
        run: |
          set +e
          python evals/runner.py --suite methodologies --case 04 --arm B --runs /tmp/cca-method-smoke --cca-skill skills/cca > /tmp/cca-method-smoke.json
          code=$?
          set -e
          test "$code" -eq 1
          grep '"behavioral_run_executed": false' /tmp/cca-method-smoke.json
          test -f /tmp/cca-method-smoke/04-B/result.json
      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: finalize methodology evaluation suite'
          git push origin HEAD:refactor/unified-cca-skill

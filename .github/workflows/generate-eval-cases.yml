name: Populate Evaluation Fixtures

on:
  push:
    branches:
      - refactor/unified-cca-skill

permissions:
  contents: write

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate cases
        run: python .github/scripts/generate_eval_cases.py
      - name: Run evaluation harness tests
        run: python -m unittest discover -s evals/tests -v
      - name: Validate repository
        run: python .github/scripts/validate_repo.py
      - name: Remove one-shot generator
        run: rm .github/scripts/generate_eval_cases.py .github/workflows/generate-eval-cases.yml
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: add fourteen behavioral evaluation fixtures"
          git push

name: Unified CCA Skill Migration

on:
  push:
    branches:
      - refactor/unified-cca-skill

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python .github/scripts/migrate_unified_skill.py

      - name: Align validator and links
        run: python .github/scripts/post_migration_fix.py

      - name: Validate repository
        run: python .github/scripts/validate_repo.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: unify CCA into one installable skill"
          git push

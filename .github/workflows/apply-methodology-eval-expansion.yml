name: Apply methodology evaluation expansion

on:
  push:
    paths:
      - '.github/workflows/apply-methodology-eval-expansion.yml'
      - '.github/scripts/apply_methodology_eval_expansion.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/unified-cca-skill
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Repair staged generator typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_methodology_eval_expansion.py')
          text = p.read_text()
          text = text.replace('read_text(encoding="utf-8")netext = etext.replace(', 'read_text(encoding="utf-8")\netext = etext.replace(')
          p.write_text(text)
          PY
      - name: Apply expansion
        run: python .github/scripts/apply_methodology_eval_expansion.py
      - name: Verify tests
        run: python -m unittest discover -s evals/tests -v
      - name: Verify repository
        run: python .github/scripts/validate_repo.py
      - name: Commit generated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: expand methodology evaluation coverage'
          git push origin HEAD:refactor/unified-cca-skill
